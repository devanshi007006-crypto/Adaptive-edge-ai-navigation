system:
  mode: deployment
  device: cuda:0
  debug: false
  random_seed: 42
  log_level: ERROR
  headless: true
  watchdog_enabled: true
camera:
  source: 0
  width: 640
  height: 480
  fps: 30
detector:
  model: yolo11n.pt
  confidence_threshold: 0.28
  device: auto
  precision: fp16
  max_detections: 15
tracker:
  enabled: true
  type: botsort
  track_buffer: 25
  max_track_age: 25
depth:
  enabled: true
  cadence_strategy: periodic_2_1
  precision: fp16
  cache_interpolation: true
temporal:
  history_length: 25
  max_history_age_seconds: 1.5
  cleanup_after_seconds: 1.5
risk:
  enabled: true
  ttc_thresholds:
    critical: 1.0
    high: 2.0
    medium: 4.0
  score_thresholds:
    critical: 0.85
    high: 0.75
    medium: 0.5
    low: 0.25
uncertainty:
  enabled: true
  thresholds:
    high: 0.75
    medium: 0.5
    low: 0.25
warning:
  enabled: true
  minimum_persistence_frames: 2
  hysteresis:
    warning_enter: 0.7
    warning_exit: 0.55
    critical_enter: 0.85
    critical_exit: 0.7
navigation:
  enabled: true
  minimum_reliability: 0.7
  corridor_width_ratio: 0.4
  unknown_on_ambiguity: true
audio:
  enabled: true
  repeat_interval_seconds: 2.0
  max_queue_size: 2
  priority_interrupt: true
  stale_timeout_seconds: 1.5
  device_disconnect_fallback: silent_log
