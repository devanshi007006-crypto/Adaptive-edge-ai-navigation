# Adaptive Edge-AI Navigation System Configuration
# All thresholds and settings are centralized here. Prototype values subject to empirical calibration.

system:
  device: "auto"              # "auto", "cuda", or "cpu"
  debug: true
  random_seed: 42

camera:
  source: 0                   # Camera index (int) or video file path (str)
  width: 640
  height: 480
  fps: 30

perception:
  preprocessing:
    target_width: 640
    target_height: 640
    normalize: false
    rgb_conversion: true

  detector:
    model_name: "yolo11n.pt"  # Or "yolo11s.pt", "yolov8n.pt"
    confidence_threshold: 0.35
    iou_threshold: 0.45
    classes_of_interest:
      - person
      - bicycle
      - car
      - motorcycle
      - bus
      - truck
      - traffic light
      - fire hydrant
      - stop sign
      - bench
      - dog
      - chair
      - couch
      - potted plant
      - bed
      - dining table
      - stairs
      - door
      - pole

  tracker:
    tracker_type: "botsort.yaml" # "botsort.yaml" or "bytetrack.yaml"
    track_high_thresh: 0.5
    track_low_thresh: 0.1
    new_track_thresh: 0.6
    match_thresh: 0.8
    track_buffer: 30

  depth:
    model_name: "depth_anything_v2_vits"
    model_path: "models/depth/depth_anything_v2_vits.pth"
    is_metric: false          # Explicitly distinguish relative depth from metric scale
    input_size: 518
    relative_depth_inverted: true # If true: smaller values = closer; if false: larger values = closer

temporal:
  history_length: 15          # Number of past frames to track per object
  smoothing:
    position_alpha: 0.7       # Exponential smoothing factor for bbox center (0-1)
    depth_alpha: 0.6          # Exponential smoothing factor for depth (0-1)
    velocity_window: 5        # Rolling window size for velocity estimation
  approach:
    approaching_speed_min: 0.05 # Minimum rate of depth decrease to classify as APPROACHING
    receding_speed_min: -0.05   # Rate of depth increase to classify as RECEDING
  camera_motion:
    enabled: false            # Optical-flow based ego-motion compensation
    method: "farneback"       # "farneback" or "lucas_kanade"

risk:
  weights:
    distance_weight: 0.35
    approach_weight: 0.25
    ttc_weight: 0.20
    path_overlap_weight: 0.15
    confidence_weight: 0.05
  ttc_thresholds:
    critical: 1.5             # seconds
    warning: 3.0              # seconds
    cautious: 5.0             # seconds
  score_thresholds:
    critical: 0.75
    high: 0.55
    medium: 0.35
    low: 0.15
  uncertainty_penalty_factor: 0.2

navigation:
  corridor:
    center_min_ratio: 0.33    # Left boundary of center corridor (0.0 - 1.0)
    center_max_ratio: 0.67    # Right boundary of center corridor (0.0 - 1.0)
    critical_proximity_thresh: 0.8 # Proximity threshold triggering STOP
  free_space:
    grid_rows: 10
    grid_cols: 10
    clearance_weight: 0.6
    depth_weight: 0.4

warning:
  priority_state_machine:
    candidate_persistence_frames: 3 # Frames hazard must persist before speaking
    cooldown_seconds: 3.0          # Minimum delay before repeating non-escalated warning
    interrupt_on_escalation: true  # Allow P4 critical to interrupt ongoing speech
    suppress_p1: true              # Suppress low-priority ambient notifications
  messages:
    p4_critical: "STOP. Obstacle ahead."
    p3_left: "Move right."
    p3_right: "Move left."
    p3_center: "Obstacle in center."
    p2_medium: "Caution. Obstacle nearby."
    p1_low: "Path clear."

feedback:
  tts:
    enabled: true
    rate: 175                 # Words per minute
    volume: 1.0               # 0.0 to 1.0
    voice_index: 0            # System voice index

evaluation:
  logging:
    enabled: true
    output_dir: "data/results"
    csv_filename: "navigation_log.csv"
  metrics:
    compute_fps: true
    compute_latency: true
    track_decision_distribution: true
