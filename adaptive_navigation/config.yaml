system:
  device: auto
  debug: true
  random_seed: 42
camera:
  source: 0
  width: 640
  height: 480
  fps: 30
detector:
  model: models/detector/yolo11n.pt
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640
  device: auto
tracker:
  enabled: true
  type: botsort
  tracker_config: botsort.yaml
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  match_thresh: 0.8
  track_buffer: 30
depth:
  enabled: true
  model_type: vits
  checkpoint: models/depth/depth_anything_v2_vits.pth
  device: auto
  input_size: 518
  is_metric: false
  object_statistic: median
debug:
  display: true
  window_name: Adaptive Navigation - YOLO + BoT-SORT + Depth
  show_trails: true
  trail_length: 15
  show_depth_inset: true
perception:
  preprocessing:
    target_width: null
    target_height: null
    normalize: false
    to_rgb: false
temporal:
  history_length: 30
  smoothing:
    position_alpha: 0.7
    depth_alpha: 0.6
    velocity_window: 5
  approach:
    approaching_speed_min: 0.05
    receding_speed_min: -0.05
  camera_motion:
    enabled: false
    method: farneback
  max_history_age_seconds: 2.0
  cleanup_after_seconds: 2.0
  minimum_observations: 3
risk:
  enabled: true
  weights:
    ttc: 0.35
    distance: 0.2
    approach: 0.15
    path: 0.2
    class: 0.1
  score_thresholds:
    low: 0.25
    medium: 0.5
    high: 0.75
    critical: 0.85
  ttc_thresholds:
    critical: 1.0
    high: 2.0
    medium: 4.0
  path:
    enabled: true
    center_ratio: 0.5
    corridor_width_ratio: 0.4
  minimum_evidence_coverage: 0.5
  class_weights:
    person: 1.0
    car: 1.2
    bicycle: 1.1
    motorcycle: 1.2
    bus: 1.3
    truck: 1.3
navigation:
  enabled: true
  path:
    enabled: true
    center_x: 0.5
    width_ratio: 0.4
  zones:
    left_boundary: 0.33
    right_boundary: 0.66
  persistence:
    minimum_frames: 3
    direction_change_frames: 3
  minimum_reliability: 0.7
  free_space:
    enabled: true
  safe_direction:
    require_both_side_analysis: true
warning:
  enabled: true
  history_length: 10
  minimum_persistence_frames: 3
  escalation_frames:
    caution: 2
    warning: 3
    critical: 3
  deescalation_frames:
    warning_to_caution: 2
    caution_to_no_warning: 3
    critical_to_warning: 2
  hysteresis:
    warning_enter: 0.7
    warning_exit: 0.55
    critical_enter: 0.85
    critical_exit: 0.7
  lost_track_grace_seconds: 0.5
  minimum_reliability_for_warning: 0.5
  minimum_reliability_for_critical: 0.75
feedback:
  tts:
    enabled: true
    rate: 175
    volume: 1.0
    voice_index: 0
evaluation:
  logging:
    enabled: true
    output_dir: data/results
    csv_filename: navigation_log.csv
  metrics:
    compute_fps: true
    compute_latency: true
    track_decision_distribution: true
motion:
  minimum_dt_seconds: 0.01
  minimum_history_observations: 3
  smoothing_method: ema
  smoothing_window: 5
  stable_threshold: 0.05
  minimum_depth_reliability: MEDIUM
  max_valid_time_gap_seconds: 0.5
  depth_convention: higher_is_closer
camera_motion:
  enabled: true
  method: sparse_optical_flow
  max_features: 300
  quality_level: 0.01
  min_distance: 7.0
  ransac_enabled: true
  minimum_features: 20
  inlier_threshold: 3.0
  max_dt_seconds: 0.5
  show_flow: false
ttc:
  enabled: true
  minimum_history_observations: 3
  minimum_closing_speed: 0.05
  maximum_time_gap_seconds: 0.5
  max_ttc_seconds: 30.0
uncertainty:
  enabled: true
  weights:
    detection: 0.1
    tracking: 0.15
    depth: 0.2
    temporal: 0.1
    motion: 0.15
    camera_motion: 0.1
    ttc: 0.1
    evidence_coverage: 0.1
  thresholds:
    high: 0.75
    medium: 0.5
    low: 0.25
  consistency:
    enabled: true
audio:
  enabled: true
  backend: auto
  language: en
  volume: 1.0
  repeat_interval_seconds: 2.0
  allow_priority_interrupt: true
  max_queue_size: 2
warning_messages:
  caution: Please be cautious.
  warning: Obstacle ahead.
  critical: Immediate obstacle ahead.
hardware:
  enabled: true
  simulation_mode: true
  device_type: auto
  reconnect_interval_seconds: 5
  max_audio_queue_size: 2
  audio:
    volume: 1.0
experiment:
  logging_enabled: true
  save_debug_video: false
  save_event_log: true
  log_file: data/experiment_log.jsonl
